apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-demo
  template:
    metadata:
      labels:
        app: service-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
---
apiVersion: v1
kind: Service
metadata:
  name: clusterip-service
spec:
  selector:
    app: service-demo
  ports:
  - port: 80
    targetPort: 80
